services:

  ollama:
    image: ollama/ollama
    volumes:
      - /mnt/my-space/1-ai-agents/1-models/1-ollama:/root/.ollama
    container_name: openwebui-ollama
    tty: true
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    environment:
      - OLLAMA_VULKAN=1
      - OLLAMA_NUM_PRALLEL=4
      # - OLLAMA_NUM_GPU=5
  
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    networks:
      - default
      - mcp
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - ${OPEN_WEBUI_PORT-8080}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434' 
      - 'WEBUI_SECRET_KEY='
      - 'ENABLE_MCP_SERVER=true'
      - 'MCP_ENABLE=true'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  mcp:
    build:
      context: /mnt/my-space/1-ai-agents/3-open-webui/mcpo
      dockerfile: Dockerfile
    image: openwebui-mcp:latest
    volumes:
      - /home/allanmogley/Downloads/mcp.json:/app/config/config.json
    container_name: mcp
    tty: true
    stdin_open: true
    networks:
      - default
      - mcp
    ports:
      - 8001:8000
    depends_on:
      - open-webui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: 
      - "uvx"
      - "mcpo"
      - "--port"
      - "8000"
      - "--"
      - "uvx"
      - "mcp-server-time"
      - "--local-timezone=America/New_York"

volumes:
  ollama: {}
  open-webui: {}

networks:
  mcp:
    external: true
    name: twenty_default

